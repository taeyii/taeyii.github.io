<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Taeyi Kim</title>
  <script>
    /* Old Jekyll-era URLs → matching anchor on the single page */
    (function () {
      var p = location.pathname.toLowerCase();
      var map = [
        ['/publications', '#publications'],
        ['/publication/',  '#publications'],
        ['/talks',         '#publications'],
        ['/cv',            '#education'],
        ['/resume',        '#education'],
        ['/portfolio',     '#projects'],
        ['/about',         '#about'],
      ];
      for (var i = 0; i < map.length; i++) {
        if (p.indexOf(map[i][0]) === 0) { location.replace('/' + map[i][1]); return; }
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
           font-family: 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; background: #0A192F; color: #E2E8F0; }
    h1 { font-size: 4rem; margin: 0 0 .5rem; color: #4DA3FF; letter-spacing: -.04em; }
    p { color: rgba(255,255,255,.6); margin: 0 0 1.5rem; }
    a { display: inline-block; background: #007AFF; color: #fff; text-decoration: none; padding: .7rem 1.4rem; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>The page you're looking for has moved.<br/>찾으시는 페이지가 이동되었습니다.</p>
    <a href="/">Go to homepage →</a>
  </div>
</body>
</html>
